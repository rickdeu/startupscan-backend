version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - startupscan_network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - startupscan_network

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - startupscan_network

  # One-shot init container: pulls the default balanced-engine model(s) so the
  # `ollama` service has them ready as soon as `docker compose up` finishes.
  # Waits for the server's health check instead of a fixed sleep, so it never
  # races a slow first boot. Never runs `ollama pull` from inside a Django
  # request — that can take minutes and would block the response.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-llama3.1:8b}"
    networks:
      - startupscan_network
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "python manage.py migrate && gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - media_volume:/app/media
      - static_volume:/app/staticfiles
      - ai_models_volume:/app/ai_models
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    networks:
      - startupscan_network

  celery-worker:
    build:
      context: .
      dockerfile: celery/Dockerfile
    command: bash -c "celery -A startupscan_api worker --loglevel=info"
    volumes:
      - .:/app
      - ./data:/app/data
      - media_volume:/app/media
      - ai_models_volume:/app/ai_models
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - web
    networks:
      - startupscan_network

  celery-beat:
    build:
      context: .
      dockerfile: celery/Dockerfile
    command: bash -c "celery -A startupscan_api beat --loglevel=info"
    volumes:
      - .:/app
      - ./data:/app/data
      - media_volume:/app/media
      - ai_models_volume:/app/ai_models
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - web
    networks:
      - startupscan_network

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:
  ai_models_volume:
  ollama_data:

networks:
  startupscan_network:
    driver: bridge