{% extends "analyzer/base.html" %}

{% block content %}
<div class="container py-5 text-center">

        <i class="fas fa-times-circle fa-5x text-warning"></i>
    </div>
    <h1 class="fw-bold mb-3">Pagamento cancelado</h1>
    <p class="text-muted mb-4">

    <a href="{% url 'subscription_plans' %}" class="btn btn-primary me-2">

    </a>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-light">
        Voltar ao dashboard
    </a>
</div>
{% endblock %}
