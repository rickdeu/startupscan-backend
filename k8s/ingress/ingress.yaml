apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: startupscan-ingress
  namespace: startupscan
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  tls:
  - hosts:
    - yourdomain.com
    secretName: startupscan-tls
  rules:
  - host: yourdomain.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: django-service
            port:
              number: 8000