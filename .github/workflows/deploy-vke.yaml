name: Deploy to Vultr Kubernetes Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  K8S_NAMESPACE: startupscan
  VKE_CLUSTER_NAME: startupscan-cluster

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Django image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
    
    - name: Build and push Celery image
      uses: docker/build-push-action@v3
      with:
        context: .
        file: ./celery/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository }}-celery:latest
          ghcr.io/${{ github.repository }}-celery:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
    
    - name: Configure VKE credentials
      run: |
        echo "${{ secrets.VKE_KUBECONFIG }}" > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml
    
    - name: Deploy to VKE
      run: |
        # Set image tags
        sed -i "s|IMAGE_TAG|${{ github.sha }}|g" k8s/deployments/*.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f k8s/configs/
        kubectl apply -f k8s/volumes/
        kubectl apply -f k8s/deployments/
        kubectl apply -f k8s/services/
        kubectl apply -f k8s/ingress/
        
        # Wait for rollout
        kubectl rollout status deployment/django-deployment -n $K8S_NAMESPACE